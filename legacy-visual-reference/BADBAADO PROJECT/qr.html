<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Referral QR Code — BADBAADO</title>
  <link rel="icon" href="./assets/badbaado-logo.jpg">
  <meta name="description" content="Scan to view referral information">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      brand: {50:'#f0fbfd',100:'#d9f5f9',200:'#b2eaf2',300:'#86ddea',400:'#4fcede',500:'#22c0d6',600:'#12a8be',700:'#0f8fa3',800:'#0d7688',900:'#0c5c6b'}
    }, fontFamily: { sans: ['Inter','system-ui','sans-serif'] } } } };
  </script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body data-page="qr" class="min-h-screen bg-slate-100">
  <div class="flex min-h-screen flex-col items-center justify-center px-4 py-10">
    <!-- QR card -->
    <div class="card w-full max-w-md overflow-hidden">
      <!-- header -->
      <div class="flex items-center justify-between px-6 py-4" style="background:linear-gradient(120deg,#0b2637,#0d3d4d)">
        <div class="flex items-center gap-2.5 text-white">
          <img src="./assets/badbaado-logo.jpg" alt="BADBAADO logo" class="h-9 w-9 rounded-full object-cover ring-1 ring-white/25">
          <div>
            <p class="text-base font-extrabold tracking-tight leading-none">BADBAADO<span class="text-brand-400">.</span></p>
            <p class="mt-0.5 text-[10px] font-semibold uppercase tracking-widest text-brand-300/70">Patient QR Card</p>
          </div>
        </div>
        <span class="badge tb-1" id="qrTriage">—</span>
      </div>

      <div class="px-6 py-6">
        <!-- Patient -->
        <div class="flex items-center gap-3">
          <span class="grid h-12 w-12 flex-none place-items-center rounded-xl bg-brand-50 text-brand-700">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <div>
            <h1 class="text-lg font-extrabold tracking-tight text-slate-900" id="qrName">—</h1>
            <p class="text-sm text-slate-500" id="qrAge">—</p>
          </div>
        </div>

        <!-- QR graphic -->
        <div class="mt-6 mx-auto w-fit rounded-2xl border-2 border-slate-100 p-3">
          <div id="qrGraphic"><div class="skeleton h-42 w-42" style="width:168px;height:168px"></div></div>
        </div>
        <p class="mt-3 text-center text-xs font-medium text-slate-500">Scan to view referral information</p>

        <!-- Details grid -->
        <div class="mt-6 grid grid-cols-2 gap-3">
          <div class="rounded-xl bg-slate-50 p-3"><p class="text-[10px] font-bold uppercase tracking-wide text-slate-400">Patient ID</p><p class="mt-0.5 text-sm font-bold text-slate-800" id="qrPatId">—</p></div>
          <div class="rounded-xl bg-slate-50 p-3"><p class="text-[10px] font-bold uppercase tracking-wide text-slate-400">Referral ID</p><p class="mt-0.5 text-sm font-bold text-slate-800" id="qrRefId">—</p></div>
          <div class="col-span-2 rounded-xl bg-slate-50 p-3"><p class="text-[10px] font-bold uppercase tracking-wide text-slate-400">Receiving hospital</p><p class="mt-0.5 text-sm font-bold text-slate-800" id="qrTo">—</p></div>
          <div class="rounded-xl bg-slate-50 p-3"><p class="text-[10px] font-bold uppercase tracking-wide text-slate-400">Department</p><p class="mt-0.5 text-sm font-bold text-slate-800" id="qrDept">—</p></div>
          <div class="rounded-xl bg-slate-50 p-3"><p class="text-[10px] font-bold uppercase tracking-wide text-slate-400">Generated</p><p class="mt-0.5 text-sm font-bold text-slate-800" id="qrWhen">—</p></div>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="no-print mt-6 flex flex-wrap items-center justify-center gap-3">
      <a href="dashboard.html" class="btn btn-outline !py-2.5"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back to dashboard</a>
      <button id="qrDownload" class="btn btn-outline !py-2.5"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Download QR</button>
      <button id="qrPrint" class="btn btn-primary !py-2.5"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Print card</button>
    </div>
    <p class="no-print mt-4 text-xs text-slate-500">Hand this QR card to the receiving ER on patient arrival for instant record access.</p>
  </div>

  <script src="./js/data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
